name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0）'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 检查 Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          ls "${SDK_ROOT}/platforms" 2>/dev/null || echo "platforms 目录不存在"
          ls "${SDK_ROOT}/build-tools" 2>/dev/null || echo "build-tools 目录不存在"

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 解析版本号
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          else
            NAME="${{ inputs.version }}"
            TAG="v${NAME}"
          fi
          # 1.2.3 -> 10203，保证 versionCode 单调递增
          CODE=$(echo "$NAME" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "版本: ${NAME} (code=${CODE})，标签: ${TAG}"

      - name: 写入固定签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::缺少 Secret KEYSTORE_BASE64，无法使用固定密钥签名。请按 docs/GITHUB-BUILD.md 的「固定密钥发布」配置 4 个 Secrets。"
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > android/app/release.jks
          {
            echo "storeFile=app/release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/keystore.properties
          echo "签名密钥已写入 android/app/release.jks"

      - name: 构建 Release APK
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 校验签名信息
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::未找到 release APK"
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          BUILD_TOOLS=$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -q "SHA-256" /tmp/certs.txt

      - name: 重命名产物
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/pinyin-park-${{ steps.version.outputs.tag }}.apk"
          ls -lh dist

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 拼音乐园 ${{ steps.version.outputs.name }}
          body: |
            ## 🐼 拼音乐园 ${{ steps.version.outputs.name }}

            Android 安装包（`minSdk 23` / Android 6.0+），使用固定发布密钥签名，可直接覆盖安装升级。

            | 项目 | 说明 |
            |------|------|
            | 版本号 | ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }}) |
            | 签名 | 固定 release keystore |
            | 安装 | 下载 `pinyin-park-${{ steps.version.outputs.tag }}.apk`，允许「未知来源应用」后安装 |

            安装步骤详见 [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/master/docs/INSTALL.md)。
          files: |
            dist/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
